<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <meta
      name="description"
      content="Aplicación local para registrar los ingresos y gastos diarios de un vehículo que trabaja con Uber."
    />
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('control-del-carro-theme');
          document.documentElement.dataset.theme =
            guardado === 'light' ? 'light' : 'dark';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      html {
        background-color: #171717;
      }

      html[data-theme="light"] {
        background-color: #f7f7f7;
      }
    </style>
    <title>Calendario · Control del Carro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
